services:
  geocoder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuba-geocoder
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - GEOCODER_DB_PATH=/app/data/cuba_geo.db
      - PYTHONPATH=/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  # Optional: Nginx reverse proxy with rate limiting
  nginx:
    image: nginx:alpine
    container_name: cuba-geocoder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - geocoder
    profiles:
      - with-nginx

networks:
  default:
    name: geocoder-network